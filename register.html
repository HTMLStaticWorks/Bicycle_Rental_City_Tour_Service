<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Rider Account | Bikora Bicycle Rental</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css?v=6">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const savedRTL = localStorage.getItem('rtl') === 'true';
            if (savedRTL) document.documentElement.setAttribute('dir', 'rtl');
        })();
    </script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: var(--transition-smooth);
        }
        .auth-card {
            background-color: var(--card-bg);
            border-radius: 28px;
            padding: 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.15);
            border: 1px solid var(--border-color);
        }
        .social-btn {
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            transition: var(--transition-base);
        }
        .social-btn:hover {
            border-color: var(--primary-gold);
            background: rgba(255, 94, 0, 0.1);
            color: var(--primary-gold);
        }
    </style>
</head>
<body>

    <div class="auth-toggles d-flex gap-2 position-fixed top-0 end-0 p-4" style="z-index: 100;">
        <button class="theme-toggle" title="Toggle Theme"><i class="bi bi-moon-fill"></i></button>
        <button class="theme-toggle rtl-toggle-btn" title="RTL Switch"><i class="bi bi-arrow-left-right"></i></button>
    </div>

    <div class="auth-container p-3">
        <div class="auth-card mx-auto">
            <div class="text-center mb-4">
                <a href="index.html" class="brand-logo justify-content-center mb-3 fs-3">
                    <i class="bi bi-bicycle text-gold me-2"></i> Bikora
                </a>
                <h2 class="fw-bold">Create Rider Account</h2>
                <p class="text-muted">Join Bikora to book instant bike rentals & guided city tours.</p>
            </div>

            <!-- Social Registration Buttons -->
            <div class="d-flex flex-column gap-2 mb-4">
                <button type="button" onclick="window.location.href='dashboard.html'" class="btn social-btn rounded-pill w-100 d-flex align-items-center justify-content-center gap-2 fw-bold">
                    <i class="bi bi-google text-danger"></i> Sign up with Google
                </button>
                <button type="button" onclick="window.location.href='dashboard.html'" class="btn social-btn rounded-pill w-100 d-flex align-items-center justify-content-center gap-2 fw-bold">
                    <i class="bi bi-facebook text-primary"></i> Sign up with Facebook
                </button>
                <button type="button" onclick="window.location.href='dashboard.html'" class="btn social-btn rounded-pill w-100 d-flex align-items-center justify-content-center gap-2 fw-bold">
                    <i class="bi bi-apple text-dark"></i> Sign up with Apple
                </button>
            </div>

            <div class="d-flex align-items-center my-4">
                <hr class="flex-grow-1 border-secondary border-opacity-25 my-0">
                <span class="px-3 text-muted small text-uppercase">Or with email</span>
                <hr class="flex-grow-1 border-secondary border-opacity-25 my-0">
            </div>

            <form onsubmit="event.preventDefault(); alert('Account created! Welcome to Bikora.'); window.location.href = 'dashboard.html';">
                <div class="mb-3 text-start">
                    <label class="form-label fw-bold small d-block mb-1">First Name</label>
                    <input type="text" class="form-control bg-transparent py-2.5" placeholder="Alex" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label fw-bold small d-block mb-1">Last Name</label>
                    <input type="text" class="form-control bg-transparent py-2.5" placeholder="Rivera" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label fw-bold small d-block mb-1">Email Address</label>
                    <input type="email" class="form-control bg-transparent py-2.5" placeholder="alex.rivera@example.com" required>
                </div>
                <div class="mb-3 password-group text-start">
                    <label class="form-label fw-bold small d-block mb-1">Password</label>
                    <div class="password-input-wrap position-relative">
                        <input type="password" class="form-control bg-transparent py-2.5 pe-5" placeholder="At least 8 characters" required>
                        <i class="bi bi-eye-slash password-toggle-icon position-absolute top-50 end-0 translate-middle-y pe-3" style="cursor: pointer; z-index: 10;" onclick="togglePasswordVisibility(this)" title="Toggle Password Visibility"></i>
                    </div>
                </div>
                <div class="form-check mb-4 text-start">
                    <input class="form-check-input" type="checkbox" id="terms" required checked>
                    <label class="form-check-label small" for="terms">I agree to Bikora's <a href="#" class="text-gold">Rental Terms & Safety Policy</a></label>
                </div>
                <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100 py-3 fw-bold mb-4 magnetic-btn">Register & Start Riding</button>
            </form>

            <div class="text-center w-100">
                <p class="text-muted mb-0 small text-center">Already have an account? <a href="login.html" class="text-gold fw-bold text-decoration-none">Sign in here</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
